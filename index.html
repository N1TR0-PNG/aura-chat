 dvins(id){const a=(S.liveApps||[]).find(x=>x.id===id)||myApp(id);if(!a)return;const ss=S.srv.filter(s=>isStaff(s,S.me.id)&&!s.test);const cfg=a.prod||{};modal(`<h3>Add ${esc(a.name)}</h3><div class="gl">This app will be able to</div>${perms(cfg).map(p=>`<div class="row" style="cursor:default"><div class="gr"><b>${IK.check} ${esc(p)}</b></div></div>`).join('')||'<small>Nothing yet.</small>'}<label>Server</label><select class="in" id="insv">${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>${ss.length?'':'<small>You need to be an owner or moderator of a server.</small>'}<div class="cbt" style="margin-top:12px"><button class="btn" data-a="dvinok" data-v="${a.id}"${ss.length?'':' disabled'}>Add to server</button><button class="btn g" data-a="close">Cancel</button></div>`)},
 async dvinok(id){const sid=$('#insv').value;await B.patch('servers',sid,{apps:{$add:id}});A.close();toast('App added.');if(S.cur===sid)setTimeout(()=>loadApps(sid),500)},
 sapps(){const s=SRV(),inst=(S.sapps||[]);modal(`<h3>Apps in ${esc(s.name)}</h3>${inst.map(a=>`<div class="row" style="cursor:default"><span class="gi">${(a.ic?esc(a.ic):IK.apps)}</span><div class="gr"><b>${esc(a.name)}</b><small>${(a.cur?.cmds||[]).map(c=>'/'+c.n).join(' ')||'no commands'}</small></div><button class="btn g sm" data-a="sapprm" data-v="${a.id}">Remove</button></div>`).join('')||'<div class="empty">No apps installed.</div>'}<label class="tg"><input type="checkbox" data-a="scloud"${s.cloud?' checked':''}> Run apps in the cloud (needs the optional Cloud Function from the README; otherwise apps reply while you have the server open)</label><div class="cbt"><button class="btn" data-a="dvm">Browse marketplace</button><button class="btn g" data-a="close">Close</button></div>`)},
 dvm(){A.close();S.dv=S.dv||{};S.dv.tab='market';S.dv.app=null;A.dev()},
 scloud(v,t){const s=SRV();B.patch('servers',s.id,{cloud:!!t.checked})},
 async sapprm(id){const s=SRV();await B.patch('servers',s.id,{apps:{$del:id}});A.close();setTimeout(()=>loadApps(s.id),500)},
 aext(id){const a=(S.sapps||[]).find(x=>x.id===id),s=SRV();if(!a?.cur?.ext)return;const cx=ENG.ctx({server:s.name,members:(s.members||[]).length,channels:S.chs.length},a.cur);modal(`<h3>${esc(a.cur.ext.title||a.name)}</h3><div class="g2">${(a.cur.ext.cards||[]).map(c=>`<div class="sc2"><b>${esc(ENG.fmt(c.v,cx))}</b><small>${esc(c.t)}</small></div>`).join('')}</div><small style="opacity:.6">Provided by ${esc(a.name)}</small><div class="cbt"><button class="btn g" data-a="close">Close</button></div>`)},
 cbtn(v){const[mid,id]=v.split('|'),m=S.msgs.find(x=>x.id===mid);if(!m)return;const b=(m.comp?.btns||[]).find(x=>x.id===id);if(b?.form){S.fm={m,id,b};modal(`<h3>${esc(b.form.t||'Form')}</h3>${(b.form.fields||[]).map(f=>`<label>${esc(f.l)}</label><input class="in" data-fld="${esc(f.id)}" maxlength="200">`).join('')}<div class="cbt" style="margin-top:12px"><button class="btn" data-a="cform">Submit</button><button class="btn g" data-a="close">Cancel</button></div>`);return}sendInt(m,id,{})},
 cform(){const{m,id}=S.fm,vals={};document.querySelectorAll('[data-fld]').forEach(i=>vals[i.dataset.fld]=i.value.slice(0,200));A.close();sendInt(m,id,{values:vals})},
 /* admin */
 async apok(id){const a=(S.revApps||[]).find(x=>x.id===id);await B.patch('apps',id,{pub:'live',approved:true,mod:[...(a?.mod||[]),{t:Date.now(),a:'Approved by an admin'}]});toast('App approved.')},
 async aprej(id){const a=(S.revApps||[]).find(x=>x.id===id),why=(prompt('Reason for rejecting (shown to the developer)')||'').slice(0,200);if(!why)return;await B.patch('apps',id,{pub:'draft',approved:false,mod:[...(a?.mod||[]),{t:Date.now(),a:'Rejected',x:why}]});toast('App rejected.')},
 async aptier(v){const[id,t]=v.split('|');await B.patch('apps',id,{tier:t});toast('Tier updated.')},
 async clpost(){const t=$('#clt').value.trim().slice(0,80),b=$('#clb2').value.trim().slice(0,400);if(!t)return toast('Add a title.');await B.patch('changelog',rid('l'),{t:Date.now(),title:t,body:b,api:$('#cla').value.trim().slice(0,10)||APIV,breaking:$('#clk').checked,by:S.me.id});toast('Posted.');admm()}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};if(d.dvm==='sub'&&myApp(S.dv?.app)){}});
function adminApps(){const r=S.revApps||[];return `<div class="gl">Waiting for review</div>${r.map(a=>`<div class="row" style="cursor:default"><span class="gi">${(a.ic?esc(a.ic):IK.apps)}</span><div class="gr"><b>${esc(a.name)}</b><small style="white-space:normal">${esc(a.desc||'')} · ${perms(a.prod||{}).join('; ')}</small></div><button class="btn sm" data-a="apok" data-v="${a.id}">Approve</button><button class="btn g sm" data-a="aprej" data-v="${a.id}">Reject</button></div>`).join('')||'<div class="empty">Nothing to review.</div>'}<div class="gl">Live apps</div>${(S.liveApps||[]).map(a=>`<div class="row" style="cursor:default"><div class="gr"><b>${esc(a.name)}</b><small>${a.tier||'free'} tier</small></div><button class="btn g sm" data-a="aptier" data-v="${a.id}|${(a.tier||'free')==='free'?'plus':'free'}">Move to ${(a.tier||'free')==='free'?'plus':'free'}</button></div>`).join('')}`}
function adminLog(){return `<label>Title</label><input class="in" id="clt" maxlength="80"><label>Details</label><textarea class="in" id="clb2" rows="3" maxlength="400"></textarea><div class="g2"><div><label>API version</label><input class="in" id="cla" maxlength="10" placeholder="${APIV}"></div><label class="tg" style="align-self:end"><input type="checkbox" id="clk"> Breaking change</label></div><div class="cbt"><button class="btn" data-a="clpost">Post to developers</button></div>`}


document.addEventListener('input',e=>{const t=e.target;if(t.id==='pq'){GP.q=t.value;pg()}else if(t.id==='gq'){clearTimeout(GP.gt);GP.gt=setTimeout(()=>gsearch(t.value),450)}else if(t.id==='tq'){const l=$('#tl');if(l)l.innerHTML=tlHtml(t.value)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='gpv'){GP.pv=t.value;GP.ty='all';GP.q='';GP.vw='trend';sp();pk('ins','g')}else if(t.id==='gty'){GP.ty=t.value;gstart()}});
const FBP=initFB().then(b=>FB=b).catch(()=>null);
Promise.race([FBP,new Promise(r=>setTimeout(r,6000))]).then(()=>use(FB||LB));
</script></body></html>
